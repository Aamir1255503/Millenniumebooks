<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#182b45"/>
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0c097"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e0c097"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="580" fill="url(#bgGrad)"/>

  <!-- Subtle Texture Pattern Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="58" x2="400" y2="58"/>
    <line x1="0" y1="116" x2="400" y2="116"/>
    <line x1="0" y1="174" x2="400" y2="174"/>
    <line x1="0" y1="232" x2="400" y2="232"/>
    <line x1="0" y1="290" x2="400" y2="290"/>
    <line x1="0" y1="348" x2="400" y2="348"/>
    <line x1="0" y1="406" x2="400" y2="406"/>
    <line x1="0" y1="464" x2="400" y2="464"/>
    <line x1="0" y1="522" x2="400" y2="522"/>
  </g>

  <!-- Elegant Inner Border -->
  <rect x="22" y="22" width="356" height="536" fill="none" stroke="#e0c097" stroke-width="1.5" stroke-opacity="0.7"/>
  <rect x="28" y="28" width="344" height="524" fill="none" stroke="#e0c097" stroke-width="0.8" stroke-dasharray="4,3" stroke-opacity="0.4"/>

  <!-- Corner Flourishes -->
  <path d="M 22 42 L 42 22 M 378 42 L 358 22 M 22 538 L 42 558 M 378 538 L 358 558" stroke="#e0c097" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Top Metadata / Imprint -->
  <text x="200" y="62" font-family="'Georgia', serif" font-size="9" fill="#e0c097" letter-spacing="4" text-anchor="middle" font-weight="600">MILLENNIUMEBOOKS</text>
  <text x="200" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#e5e5e5" letter-spacing="2.5" text-anchor="middle" opacity="0.75">ORIGINAL EDITION • NOVA FORGE LLC</text>

  <!-- Category Badge -->
  <rect x="70" y="94" width="260" height="20" rx="3" fill="#000000" fill-opacity="0.3" stroke="#e0c097" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="200" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#e0c097" letter-spacing="2" text-anchor="middle" font-weight="600">HEALTH & LONGEVITY</text>

  <!-- Central Icon Motif -->
  <g>
    <path d="M208 128 C200 130 194 137 194 145 C194 153 200 159 208 160 C198 162 188 154 188 144 C188 134 198 126 208 128 Z" fill="none" stroke="#e0c097" stroke-width="2"/>
  </g>

  <!-- Central Ornamental Divider -->
  <line x1="140" y1="184" x2="260" y2="184" stroke="#e0c097" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="200" cy="184" r="3" fill="#e0c097"/>

  <!-- Main Title -->
  <text x="200" y="240" font-family="'Playfair Display', 'Georgia', serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="2" text-anchor="middle">THE SLEEP</text>
  <text x="200" y="278" font-family="'Playfair Display', 'Georgia', serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="2" text-anchor="middle">CATALYST</text>

  <!-- Lower Ornamental Line -->
  <line x1="160" y1="316" x2="240" y2="316" stroke="#e0c097" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Subtitle -->
  <foreignObject x="45" y="336" width="310" height="85">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: system-ui, -apple-system, sans-serif; font-size: 13px; line-height: 1.5; color: #e2e8f0; text-align: center; font-weight: 300; letter-spacing: 0.5px; opacity: 0.95;">
      Science-Backed Recovery & Daily Peak Energy
    </div>
  </foreignObject>

  <!-- Format Strip -->
  <g transform="translate(110, 440)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#000000" fill-opacity="0.35" stroke="#e0c097" stroke-width="1" stroke-opacity="0.6"/>
    <text x="90" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ffffff" letter-spacing="2" text-anchor="middle" font-weight="500">DIGITAL: PDF + EPUB</text>
  </g>

  <!-- Bottom Publisher Seal -->
  <line x1="50" y1="500" x2="350" y2="500" stroke="#e0c097" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="200" y="522" font-family="'Georgia', serif" font-size="8.5" fill="#e0c097" letter-spacing="2" text-anchor="middle" font-weight="600">VERIFIED ORIGINAL WORK</text>
  <text x="200" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#cbd5e1" letter-spacing="1.5" text-anchor="middle" opacity="0.7">INSTANT SECURE DOWNLOAD • STRIPE VERIFIED</text>

  <!-- 3D Book Spine Left Shadow Overlay -->
  <rect x="0" y="0" width="18" height="580" fill="url(#spine)"/>
  <line x1="18" y1="0" x2="18" y2="580" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.15"/>
</svg>